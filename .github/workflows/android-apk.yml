name: Android APK - Sakura X Panel
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Restore Android project
        run: dotnet restore SakuraXPanel.csproj
      - name: Build installable debug APK
        run: dotnet build SakuraXPanel.csproj -f net9.0-android -c Debug --no-restore -p:AndroidPackageFormat=apk
      - name: Publish APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sakura-X-Panel-APK
          path: |
            bin/Debug/net9.0-android/*Signed*.apk
            bin/Debug/net9.0-android/*-Signed.apk
            bin/Debug/net9.0-android/*.apk
          if-no-files-found: error
          retention-days: 14
